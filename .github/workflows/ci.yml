name: Acceptance checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extension:
        description: Optional suite to check
        type: choice
        required: true
        options: [recovery, batch, all]

jobs:
  framework:
    name: Starter framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_framework.py' -v

  core:
    name: Task A, Task B and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Task B batch and transaction security
        run: |
          python -m unittest discover -s extensions_tests -p 'test_batch.py' -v
          python -m unittest discover -s extensions_tests -p 'test_security.py' -v

  optional:
    name: Selected optional tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - if: inputs.extension == 'recovery' || inputs.extension == 'all'
        run: python -m unittest discover -s extensions_tests -p 'test_recovery.py' -v
      - if: inputs.extension == 'batch' || inputs.extension == 'all'
        run: python -m unittest discover -s extensions_tests -p 'test_batch.py' -v
