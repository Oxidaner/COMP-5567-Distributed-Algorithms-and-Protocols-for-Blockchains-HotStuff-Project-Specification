  <style>

    .card summary {

    .card-group {

    @media (max-width: 42rem) {

<body>
  <header class="shell hero">

  </header>
  <main class="shell">
    <div class="tools">
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search">Search in English or Chinese</label>
        <input id="search" type="search" placeholder="中英文搜索 · QC / 余额" autocomplete="off" spellcheck="false">

          <select id="topic-select"></select>

    <footer>
      Project evidence and implementation at <a href="https://github.com/Oxidaner/COMP-5567-Distributed-Algorithms-and-Protocols-for-Blockchains-HotStuff-Project-Specification/tree/1d37b8a6346de3d87892faee4969b7e118e3c074">revision 1d37b8a</a>.
      Protocol reference <a href="https://reitermk.github.io/papers/2019/PODC.pdf">HotStuff</a> and signature standard <a href="https://www.rfc-editor.org/rfc/rfc8032">RFC 8032</a>.
    </footer>

  <script>
    const groups = [
      { label: "Overview", items: [
        ["Can you summarize your project in one sentence?", "能用一句话概括你们的项目吗？", "We built a four-replica HotStuff simulator to agree on transfer order and produce the same balances and receipts.", "overview introduction project summary 概述 项目", true],
        ["What is the difference between Task A and Task B?", "任务 A 和任务 B 有什么区别？", "Task A orders and commits blocks. Task B runs the transactions in those blocks and records the results.", "roles architecture 分工 区别", true],
        ["How do Task A and Task B connect?", "任务 A 和任务 B 是怎么衔接的？", "Task A passes the committed block IDs to Task B. Task B runs the transactions in those blocks and clears finished requests from the pool.", "handoff integration form_qc Node 接口 衔接", true],
        ["Why do the four replicas get the same result?", "为什么四个副本会得到相同的结果？", "All replicas start in the same state. They run the same transactions in the same order and follow the same rules.", "replicated state machine determinism consistency agreement 一致性 确定性", true],
        ["How is the simulator organized?", "模拟器的架构是怎样的？", "FastAPI serves the dashboard. HotStuffDemo runs the event queue. Each replica has its own consensus and ledger state. They share one process.", "architecture layers coordinator frontend backend 结构 架构"],
        ["Which parts came from the starter?", "哪些部分来自课程提供的起始代码？", "The starter gave us the event queue, API, dashboard and dispatch_qc. We added consensus logic, transaction execution, signing and tests.", "provided reused original files 教学模板"],
      ] },
      { label: "Consensus", items: [
        ["What is a view, and how is the leader chosen?", "什么是视图？系统如何选出领导者？", "A view is one consensus round. Leadership rotates from Node 1 to Node 4 as the view number rises.", "leader round robin rotation next_view enter_view 视图 换届", true],
        ["How does the leader choose a parent block?", "领导者如何选择父区块？", "The leader uses the block named in its HighQC. It includes that QC in the proposal.", "propose justification parent branch 父块 提案"],
        ["What is a quorum certificate, and why do you need three votes?", "什么是法定人数证书（QC）？为什么需要三票？", "A QC needs votes from three different replicas for the same block and view. Any two groups of three share at least two replicas. With one fault, at least one shared replica is honest.", "QC 3-of-4 majority BFT intersection 证书 法定人数", true],
        ["What does a replica check before voting?", "副本在投票前会检查什么？", "A replica checks the current leader and view. It checks the parent QC and votes at most once per view. The proposal must extend its locked branch or carry a QC newer than its lock.", "vote can_vote safe node lock rule 安全投票", true],
        ["What is the difference between HighQC and LockedQC?", "HighQC 和 LockedQC 有什么区别？", "HighQC is the highest valid QC the replica knows. The leader uses it to pick a parent. LockedQC protects the branch the replica has locked.", "highest lock locked branch 锁"],
        ["What makes a three-chain, and which block commits?", "怎样形成三链？哪个区块会被提交？", "Three linked blocks need QCs in consecutive views. The third QC commits the oldest block. Any uncommitted ancestors go first.", "A4 consecutive certify grandparent 三链 提交", true],
        ["Does one QC commit its own block?", "一张 QC 能直接提交它认证的区块吗？", "No. A QC certifies its own block. In the demo, B3's QC completes the three-chain and commits B1.", "certified versus committed one qc 认证 确认", true],
        ["What happens if there is a gap between views?", "如果视图编号不连续，会发生什么？", "A view gap delays commitment. A later three-chain with consecutive views can still commit earlier blocks.", "timeout skipped view gap 连续 缺口"],
        ["Why are empty blocks useful?", "为什么需要空块？", "Empty blocks keep consensus moving without new transactions. They help commit earlier blocks and let us test Task A on its own.", "empty payload no transactions 空块"],
        ["Can one node or two votes form a QC?", "一个节点或两张票能形成 QC 吗？", "No. A QC needs three valid votes from three different replicas.", "quorum duplicate threshold 两票"],
      ] },
      { label: "Transactions", items: [
        ["What is the lifecycle of a transaction?", "一笔交易会经历哪些阶段？", "A signed request enters the mempool. The leader puts it in a block. After commit, replicas run it, save the receipt and remove it from the pool.", "lifecycle transaction flow B1 B2 B3 B4 交易流程", true],
        ["Why don't you debit the account when a request is submitted?", "为什么提交交易请求时不立即扣款？", "We debit only after the block commits. The committed order decides which payments can use the available balance.", "admission pending mempool early double spending 扣款 入池", true],
        ["What does submit validate?", "submit 会校验哪些内容？", "It checks both accounts and the sender's signature. The amount must be an integer from 1 to 1,000,000. The nonce must be a whole number starting at 0. New requests cannot leave gaps in the sender's queue.", "B1 submit validation invalid amount 准入 校验 金额"],
        ["What is the mempool, and when does an item leave it?", "什么是交易池？交易什么时候会离开交易池？", "The mempool holds pending requests, even after they appear in a proposal. A request leaves when it gets a final receipt.", "transaction pool packing finalize_transactions 清池 交易池"],
        ["How do you choose transactions for a block?", "怎样为区块选择要打包的交易？", "We take pending requests in arrival order, up to five by default. We skip valid requests already in uncommitted blocks on the parent chain. We also skip requests with a final receipt.", "B2 select_transactions ancestry packing FIFO 打包 父链"],
        ["What happens to transactions in an abandoned proposal?", "废弃提案中的交易会怎样处理？", "They stay in the pool. A later leader can pick them for another branch that does not already include them.", "fork orphan repropose abandoned branch 分叉 废弃"],
        ["How do you stop uncommitted blocks from executing?", "如何防止执行未提交区块中的交易？", "Before running any transfer, each replica checks the full block list. Every block must be known and committed locally. The list must follow commit order and include earlier unexecuted blocks with transactions.", "B3 gates prevalidation execute_committed atomic 未提交 顺序"],
        ["Does atomic validation mean the whole block is rolled back if a transfer fails?", "原子校验是否意味着一笔转账失败时，区块会整体回滚？", "No. The atomic check applies to the list of blocks. Each transfer gets its own result. Earlier successful transfers stay in place.", "all-or-nothing rollback batch atomic 原子性 回滚"],
        ["What does StateMachine.apply do?", "StateMachine.apply 做了什么？", "It checks the signature and ID. It returns a stored receipt for a valid retry. For a new request, it checks the nonce, accounts, amount and funds. Success updates both balances and advances the nonce. It records the result.", "apply debit credit ledger B3 B4 记账"],
        ["What happens if a committed transfer has insufficient funds?", "已提交区块中的转账如果余额不足，会怎么处理？", "The balances stay the same. The transfer gets a rejected receipt and leaves the pool. If the signature is valid and the nonce matches, the nonce goes up by one.", "B3 B4 rejected balance failure insufficient 余额不足 失败", true],
        ["Can delivering the same block or request again debit twice?", "重复投递同一个区块或请求，会扣两次款吗？", "No. A block replay returns saved results. A valid retry returns the original receipt after execution.", "B4 retries idempotent duplicate redelivery 幂等 重试", true],
        ["Why keep two kinds of receipts?", "为什么要保留两类回执？", "A transaction receipt gives the final result by ID and prevents a second debit. An execution receipt records what happened at a specific spot in a block. A bad entry cannot replace a valid transaction's result.", "canonical execution_receipts position identity 两类回执 位置", true],
        ["What does the batch limit control?", "批量上限控制什么？", "It caps the number of transactions in a new block. The default is five. The UI offers 1, 2 and 5. The API accepts any positive integer.", "B5 configure_batch payload capacity 上限 批量"],
        ["Why do you reject true as a batch limit?", "为什么不能把 true 用作批量上限？", "Python treats true as a kind of integer. We require the actual int type, so true is rejected.", "B5 Python bool isinstance strict integer 布尔"],
      ] },
      { label: "Signatures & nonces", items: [
        ["What is signed, and who signs it?", "交易签名覆盖哪些内容？由谁签名？", "The browser or CLI signs with the sender's Ed25519 private key. It signs the chain domain, sender, receiver, amount and nonce. Replicas verify it with the sender's public key.", "B6 Ed25519 canonical payload web crypto CLI 签名 私钥 公钥"],
        ["Why do you need canonical JSON and a chain domain?", "为什么需要规范化 JSON 和链域标识？", "Canonical JSON gives both sides the same bytes to sign or check. The chain field ties the signature to this project's domain.", "canonicalization sorted domain separation 规范化 域"],
        ["How is the transaction ID calculated?", "交易 ID 是怎么计算的？", "We hash the canonical payload with SHA-256. The ID is Tx- plus the first 24 hex digits of the hash. The same payload keeps the same ID.", "stable ID hash digest identity signature case 哈希 身份"],
        ["Why check a signature again at execution?", "为什么执行交易时还要再验一次签名？", "A committed block may contain an entry that never went through the mempool. We check its signature and ID before use.", "B6 verify twice defense in depth tamper 入池 执行 二次验签", true],
        ["What if the amount changes or a different account signs?", "如果金额被修改，或者由其他账户签名，会怎样？", "The signature check fails. We reject the request at submission. If it appears in a committed block, it fails and leaves the nonce unchanged.", "tampering wrong sender wrong key invalid signature 篡改 错签"],
        ["Can a bad entry occupy the ID of a valid pending request?", "无效条目能抢占合法待处理交易的 ID 吗？", "No. We check the signature and ID before looking up a receipt. A bad entry gets a failure receipt for its block position. The valid request stays in the pool.", "forged borrowed ID poisoning canonical failure 冒用 伪造 回执", true],
        ["What is a nonce, and how does it stop replay?", "什么是 nonce？它如何防止重放？", "A nonce is a sender's counter, starting at 0. A new transfer needs the current nonce to execute. An exact retry returns the same ID or receipt. A different request cannot reuse an old nonce.", "B6 replay prevention stale past nonce 防重放 序号", true],
        ["Can future nonces be submitted?", "可以提前提交使用未来 nonce 的交易吗？", "Yes, if the pending queue has no gaps. If 0 and 1 are pending, you can add 2. You have to add 2 before 3.", "gap contiguous pending nonce future 缺号 跳号 连续"],
        ["Why does an authenticated failure consume a nonce?", "为什么通过身份验证的失败交易也会消耗 nonce？", "The committed request has a final result. Advancing the nonce lets the next request run. A bad signature or wrong nonce leaves the counter unchanged.", "insufficient funds failure final nonce rejected 失败 消耗"],
        ["What is the difference between Retry and Sign & submit?", "Retry 和 Sign & submit 有什么区别？", "Retry resends the same signed request and keeps the ID. Sign & submit creates a new request with the next available nonce.", "retry button form new nonce 提交按钮 重试"],
        ["Are transaction signatures the same as QC votes?", "交易签名和用于形成 QC 的共识投票是一回事吗？", "Ed25519 signatures prove who authorized a transfer. QC votes come from node IDs trusted by the simulator.", "consensus certificate threshold signature sender authentication 区别"],
      ] },
      { label: "Faults & recovery", items: [
        ["What happens when the leader crashes?", "领导者崩溃后会发生什么？", "A timeout starts a new view with a new leader. Three live replicas can still form a QC. The crashed replica waits for recovery.", "A6 timeout pacemaker failover 领导者 崩溃 超时"],
        ["What if only two replicas can vote?", "如果只有两个副本能投票，会发生什么？", "Two votes are too few for a QC. Views can still change, but new blocks cannot get certified.", "stall availability safety liveness 两节点 停滞"],
        ["How does a crashed replica catch up?", "崩溃的副本恢复后如何追上其他副本？", "It copies the committed chain, balances, nonces and receipts from a live peer. It keeps its voting history and any higher valid QC or lock.", "A6 recover catch up sync receipts 恢复 同步"],
        ["What is equivocation, and how is it handled?", "什么是同一视图中的冲突提案？系统怎么处理？", "It means the leader proposes conflicting blocks in the same view. Honest replicas vote at most once per view. With one fault and three votes per QC, at most one block gets a QC.", "A7 byzantine conflicting proposals double proposal 拜占庭 双提案"],
        ["What is checked when evidence is malformed?", "系统如何检查格式错误或内容无效的共识证据？", "We check the voter IDs, block and view. A QC needs distinct trusted voters for the same block and view. Invalid evidence cannot update the QC or lock.", "A7 invalid QC duplicate vote certificate malformed 非法 重复投票"],
        ["What is the difference between safety and liveness here?", "在这个项目中，安全性和活性有什么区别？", "Safety means correct replicas never commit conflicting histories. Liveness means they make progress under the right conditions. With two voters, progress stalls because the quorum is three.", "progress agreement fault tolerance 安全性 活性"],
      ] },
      { label: "Live demo", items: [
        ["How would you demonstrate Task A on screen?", "如何在界面上演示任务 A？", "I reset the demo and use Next Step to show the proposal, votes and QC. I keep stepping until the first block commits.", "dashboard preview step 操作 现场 共识"],
        ["What changes when Alice sends Bob 10?", "Alice 给 Bob 转账 10 后，状态会怎么变？", "While it is pending, all balances stay at 100 and Alice's nonce stays at 0. After commit, Alice has 90, Bob has 110 and Charlie has 100. Alice's nonce becomes 1.", "example worked balance 90 110 success 成功 示例", true],
        ["Which failure case would you show live?", "你会现场演示哪个失败场景？", "After Alice pays 10, I submit a transfer of 101. It enters the pool, then fails at execution for insufficient funds. Alice stays at 90 and her nonce becomes 2.", "demo rejection 101 insufficient funds 余额不足 现场"],
        ["What happens in the two transfers of 80 example?", "连续两笔金额为 80 的转账，结果会怎样？", "Alice starts with 100 and pays Bob 80. The second payment of 80 to Charlie fails. Alice has 20, Bob has 180 and Charlie has 100. Alice's nonce becomes 2.", "slides walkthrough 80 20 180 failed PPT 样例"],
        ["Why might a submitted transfer appear to do nothing?", "为什么提交了转账，看起来却没有任何变化？", "The transfer may still be pending. Its block may have a QC and still be waiting to commit. I check that the demo is running, then look for the receipt.", "troubleshoot start pause pending why balance no change 卡住"],
        ["How would you show idempotency on the dashboard?", "怎样在界面上演示幂等性？", "I retry before commit and show one pending ID. I retry after execution and show the same receipt, balances and nonce.", "retry demo validate twice 界面 重试 幂等"],
        ["What does Live nodes agree mean?", "Live nodes agree 表示什么？", "The live replicas have the same committed chain, balances, nonces and receipts. The dashboard compares only replicas that are online.", "consistent indicator status agreement 一致 状态"],
      ] },
      { label: "Tests & evidence", items: [
        ["What are your test results?", "测试结果怎么样？", "The report's run passed 141 tests. That is 100 core tests and 41 extension tests.", "counts 141 100 41 test results 测试数量"],

        ["Did you test Task B apart from Task A?", "有没有独立于任务 A 测试任务 B？", "Yes. Unit tests used blocks already marked as committed. Integration tests used the real event queue to check that consensus triggers execution.", "unit integration fixture isolated tests 隔离 集成"],
        ["How did you test batch sizes?", "怎样验证不同的批量大小？", "We ran seven transfers of 1 with limits of 1, 2 and 5. We checked each block size and all seven receipts. Each run ended at 93, 107 and 100.", "test_batch seven 7 batching 93 107 批量测试"],
        ["How did you verify retries and signature checks?", "如何验证重试行为和签名检查？", "We retried requests before and after commit. We tested changed payloads, wrong keys and changed IDs. We checked that a bad entry cannot block a valid request with the same ID.", "test_security security boundaries signatures replay 安全测试"],
        ["Did passing the tests prove the whole protocol correct?", "通过测试能证明整个协议正确吗？", "No. The tests check specific cases, such as crashes and message order. A formal proof would need to cover all allowed cases.", "proof beyond coverage test limitations formal 证明"],
      ] },
      { label: "Limits & contribution", items: [
        ["Is this running on four physical machines?", "系统是在四台物理机器上运行的吗？", "All four replicas run in one process. An event queue simulates messages and timeouts.", "simulation networking one process network P2P 单进程 四台"],
        ["What happens if the whole process restarts?", "如果整个进程重启，会发生什么？", "It resets to the genesis block. The ledger, nonces, receipts and voting history are all stored in memory. A single replica can recover from a live peer.", "durability persistent storage process restart 重启 持久化"],

        ["Did you measure throughput or latency?", "你们测过吞吐量或延迟吗？", "We tested correctness. We did not measure throughput or network latency. The dashboard's step interval is for the demo.", "performance TPS benchmark timing 性能 延迟"],
        ["Which part did you personally work on?", "你个人负责了项目的哪一部分？", "I worked on [feature]. I tested [scenario]. The result was [result]. You can see it in [commit or file].", "contribution individual responsibility AI role commits 个人贡献 分工"],
      ] },
    ];

    const questions = groups.flatMap(({label, items}) => items.map(
      ([question, questionZh, answer, keywords, priority = false]) => ({label, question, questionZh, answer, keywords, priority})
    ));
    const filters = [
      {label: "Start here", matches: item => item.priority},
      {label: "All questions", matches: () => true},
      ...groups.map(({label}) => ({label, matches: item => item.label === label})),
    ];
    const allQuestions = filters[1];
    let activeFilter = filters[0];
    const topics = document.querySelector("#topics");
    const topicSelect = document.querySelector("#topic-select");
    const cards = document.querySelector("#cards");
    const input = document.querySelector("#search");
    const clear = document.querySelector("#clear");
    const status = document.querySelector("#results");
    const empty = document.querySelector("#empty");

    function words(text) {
      return text.toLowerCase().replace(/['’]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
    }

    for (const item of questions) {
      const details = document.createElement("details");
      details.className = "card";
      const summary = document.createElement("summary");
      const heading = document.createElement("span");
      const group = document.createElement("span");
      group.className = "card-group";
      group.textContent = item.label;
      const translation = document.createElement("span");
      translation.className = "question-zh";
      translation.lang = "zh-CN";
      translation.textContent = item.questionZh;
      heading.append(group, document.createTextNode(item.question), translation);
      summary.append(heading);
      const answer = document.createElement("p");
      answer.className = "answer";
      answer.lang = "en";
      answer.textContent = item.answer;
      details.append(summary, answer);
      cards.append(details);
      item.card = details;
      item.group = group;
      item.searchText = words([item.question, item.questionZh, item.answer, item.label, item.keywords].join(" "));
    }

    function choose(filter) {
      activeFilter = filter;
      if (filter === filters[0]) input.value = "";
      update();
    }

    for (const [index, filter] of filters.entries()) {
      const button = document.createElement("button");
      button.className = "topic";
      button.type = "button";
      const count = document.createElement("span");
      count.className = "topic-count";
      count.textContent = questions.filter(filter.matches).length;
      button.append(document.createTextNode(filter.label), count);
      button.addEventListener("click", () => choose(filter));
      filter.button = button;
      topics.append(button);
      topicSelect.add(new Option(`${filter.label} (${count.textContent})`, String(index)));
    }

    function update() {
      const tokens = words(input.value).split(" ").filter(Boolean);
      if (tokens.length && activeFilter === filters[0]) activeFilter = allQuestions;
      let matches = 0;
      for (const item of questions) {
        const visible = activeFilter.matches(item) && tokens.every(token => item.searchText.includes(token));
        item.card.hidden = !visible;
        item.group.hidden = activeFilter !== filters[0] && activeFilter !== allQuestions;
        if (visible) matches += 1;
      }
      for (const filter of filters) {
        filter.button.setAttribute("aria-pressed", String(filter === activeFilter));
      }
      topicSelect.value = String(filters.indexOf(activeFilter));
      status.textContent = `${activeFilter.label} · ${matches} ${matches === 1 ? "question" : "questions"}`;
      clear.hidden = !input.value;
      empty.hidden = matches > 0;
    }

    document.querySelector("#search-form").addEventListener("submit", event => {
      event.preventDefault();
      update();
    });
    topicSelect.addEventListener("change", () => choose(filters[Number(topicSelect.value)]));
    input.addEventListener("input", update);
    clear.addEventListener("click", () => {
      input.value = "";
      input.focus();
      update();
    });
    questions[0].card.open = true;
    update();
  </script>
</body>
