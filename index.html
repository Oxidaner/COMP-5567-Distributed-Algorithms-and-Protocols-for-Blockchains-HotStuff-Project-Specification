  <style>

<body>
  <header class="shell hero">

  </header>
  <main class="shell">
    <div class="tools">
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search">Search in English or Chinese</label>
        <input id="search" type="search" placeholder="中英文搜索 · QC / 余额" autocomplete="off" spellcheck="false">

          <select id="topic-select"></select>
        </label>
      </nav>
      <section aria-labelledby="results">
        <h2 class="result-header" id="results" aria-live="polite"></h2>
        <div id="cards"></div>

        <noscript><p class="empty">Enable JavaScript to use the question list and search.</p></noscript>

    </div>
    <footer>
      Project evidence and implementation at <a href="https://github.com/Oxidaner/COMP-5567-Distributed-Algorithms-and-Protocols-for-Blockchains-HotStuff-Project-Specification/tree/1d37b8a6346de3d87892faee4969b7e118e3c074">revision 1d37b8a</a>.
      Protocol reference <a href="https://reitermk.github.io/papers/2019/PODC.pdf">HotStuff</a> and signature standard <a href="https://www.rfc-editor.org/rfc/rfc8032">RFC 8032</a>.
    </footer>
  </main>
  <script>
    const groups = [
      { label: "Overview", items: [
        ["Can you summarize your project in one sentence?", "能用一句话概括你们的项目吗？", "We built a four-replica HotStuff simulation that agrees on the order of transfers and executes them to produce consistent balances and receipts.", "overview introduction project summary 概述 项目", true],
        ["What is the difference between Task A and Task B?", "任务 A 和任务 B 有什么区别？", "Task A agrees on the order of blocks and decides which ones are committed. Task B executes the transactions in those blocks and records the balances and receipts.", "roles architecture 分工 区别", true],
        ["How do Task A and Task B connect?", "任务 A 和任务 B 是怎么衔接的？", "After a quorum certificate is formed, dispatch_qc calls receive_qc on each replica. It hands the newly committed block IDs to execute_committed and then finalizes the transaction pool.", "handoff integration form_qc Node 接口 衔接", true],
        ["Why do the four replicas get the same result?", "为什么四个副本会得到相同的结果？", "They start with the same ledger and execute the same committed transactions in the same order. Each state machine uses deterministic rules without depending on a clock or random choices.", "replicated state machine determinism consistency agreement 一致性 确定性", true],
        ["How is the simulator organized?", "模拟器的架构是怎样的？", "FastAPI and the dashboard expose the controls. HotStuffDemo runs the event queue. Each Node keeps its own consensus state and StateMachine. The whole simulation runs in one process.", "architecture layers coordinator frontend backend 结构 架构"],
        ["Which parts came from the starter?", "哪些部分来自课程提供的起始代码？", "The starter supplied the framework, event queue, routes, dashboard and dispatch_qc. The project fills in the consensus and execution methods and adds signing, receipt display and verification tests.", "provided reused original files 教学模板"],
      ] },
      { label: "Consensus", items: [
        ["What is a view, and how is the leader chosen?", "什么是视图？系统如何选出领导者？", "A view is one round of consensus. The simulator rotates the leader from Node 1 through Node 4 as the view increases. It preserves the replicas' voting history and locks.", "leader round robin rotation next_view enter_view 视图 换届", true],
        ["How does the leader choose a parent block?", "领导者如何选择父区块？", "It uses the block certified by its HighQC. The proposal includes that parent certificate as evidence for why it extends that block.", "propose justification parent branch 父块 提案"],
        ["What is a quorum certificate, and why do you need three votes?", "什么是法定人数证书（QC）？为什么需要三票？", "A QC records at least three distinct votes for the same block and view. Two sets of three among four replicas overlap in at least two identities. With at most one faulty replica, at least one identity in the overlap is correct.", "QC 3-of-4 majority BFT intersection 证书 法定人数", true],
        ["What does a replica check before voting?", "副本在投票前会检查什么？", "It checks the current leader, current view and the registered QC for the parent. It can vote only once per view and only when the proposal extends its locked branch or cites a newer parent QC.", "vote can_vote safe node lock rule 安全投票", true],
        ["What is the difference between HighQC and LockedQC?", "HighQC 和 LockedQC 有什么区别？", "HighQC is the highest valid certificate the replica has learned and helps choose a parent. LockedQC protects a branch during voting. A proposal on a different branch needs a parent certificate newer than the lock.", "highest lock locked branch 锁"],
        ["What makes a three-chain, and which block commits?", "怎样形成三链？哪个区块会被提交？", "In our simulator, three directly linked blocks need QCs in consecutive views. When the third block gets its QC, the first block can commit together with any still-uncommitted ancestors, in ancestor-first order.", "A4 consecutive certify grandparent 三链 提交", true],
        ["Does one QC commit its own block?", "一张 QC 能直接提交它认证的区块吗？", "A QC certifies that block. In a normal sequence, the QC for B2 leaves B1 uncommitted. The QC for B3 completes the three-chain and commits B1.", "certified versus committed one qc 认证 确认", true],
        ["What happens if there is a gap between views?", "如果视图编号不连续，会发生什么？", "A view gap delays commitment because that chain is not consecutive. A later consecutive three-chain can still commit its oldest block and the earlier ancestors.", "timeout skipped view gap 连续 缺口"],
        ["Why are empty blocks useful?", "为什么需要空块？", "They keep consensus moving when there are no new transactions. They can also help commit earlier blocks and let us test Task A separately.", "empty payload no transactions 空块"],
        ["Can one node or two votes form a QC?", "一个节点或两张票能形成 QC 吗？", "The quorum remains three distinct valid voters. A leader cannot certify its own proposal alone, and repeated votes by one identity do not increase the count.", "quorum duplicate threshold 两票"],
      ] },
      { label: "Transactions", items: [
        ["What is the lifecycle of a transaction?", "一笔交易会经历哪些阶段？", "A signed request enters the mempool. The leader selects it for a proposal. After the block commits, the replicas execute the payload, store receipts and remove finalized requests from the pool.", "lifecycle transaction flow B1 B2 B3 B4 交易流程", true],
        ["Why don't you debit the account when a request is submitted?", "为什么提交交易请求时不立即扣款？", "At submission we do not have a committed order. That order determines which payments can succeed when an account tries to spend more than its balance. We debit only during committed execution.", "admission pending mempool early double spending 扣款 入池", true],
        ["What does submit validate?", "submit 会校验哪些内容？", "It checks that both accounts exist, the amount is a strict integer from one to one million, the nonce is a non-negative integer and the sender signature is valid. A new request also has to fit the sender's consecutive nonce queue.", "B1 submit validation invalid amount 准入 校验 金额"],
        ["What is the mempool, and when does an item leave it?", "什么是交易池？交易什么时候会离开交易池？", "It is the shared pool of admitted requests that are still pending. Selecting a request for a block leaves it in the pool. An execution outcome with a terminal transaction receipt allows it to be removed.", "transaction pool packing finalize_transactions 清池 交易池"],
        ["How do you choose transactions for a block?", "怎样为区块选择要打包的交易？", "We choose pending requests in insertion order up to the configured limit, five by default. We exclude authenticated IDs already on the chosen parent chain when they are still in flight or have a final receipt.", "B2 select_transactions ancestry packing FIFO 打包 父链"],
        ["What happens to transactions in an abandoned proposal?", "废弃提案中的交易会怎样处理？", "They stay pending. A later leader can select them on a different branch, as long as that branch does not already contain them as eligible entries.", "fork orphan repropose abandoned branch 分叉 废弃"],
        ["How do you stop uncommitted blocks from executing?", "如何防止执行未提交区块中的交易？", "Before any transfer runs, execute_committed verifies that every block is known and locally committed. It also checks the commit order and rejects a batch that skips an earlier nonempty block still waiting to execute.", "B3 gates prevalidation execute_committed atomic 未提交 顺序"],
        ["Does atomic validation mean the whole block is rolled back if a transfer fails?", "原子校验是否意味着一笔转账失败时，区块会整体回滚？", "Atomic validation applies to the input list of block IDs. After that list passes, each transfer has its own execution result. An insufficient-funds failure leaves earlier successful transfers in place.", "all-or-nothing rollback batch atomic 原子性 回滚"],
        ["What does StateMachine.apply do?", "StateMachine.apply 做了什么？", "It verifies identity, looks for a stored receipt and checks the nonce. It then checks the accounts, amount and funds. An eligible transfer updates balances and the nonce, and the execution result is recorded.", "apply debit credit ledger B3 B4 记账"],
        ["What happens if a committed transfer has insufficient funds?", "已提交区块中的转账如果余额不足，会怎么处理？", "The balances stay the same and the transfer gets a rejected receipt. If the request is authenticated and its nonce matches, that nonce is consumed once and the finalized request leaves the pool.", "B3 B4 rejected balance failure insufficient 余额不足 失败", true],
        ["Can delivering the same block or request again debit twice?", "重复投递同一个区块或请求，会扣两次款吗？", "Re-delivering an executed block returns the stored position results. At the transaction level, a valid repeated ID returns its existing receipt. Both layers prevent a second debit.", "B4 retries idempotent duplicate redelivery 幂等 重试", true],
        ["Why keep two kinds of receipts?", "为什么要保留两类回执？", "The canonical receipt is keyed by transaction ID for final status and deduplication. The execution receipt records the outcome at a block and position. That lets us expose a rejected entry without assigning its result to a legitimate transaction ID.", "canonical execution_receipts position identity 两类回执 位置", true],
        ["What does the batch limit control?", "批量上限控制什么？", "It is the maximum number of transactions in each new proposal. The default is five. The UI offers one, two and five, and the API accepts positive integers. Reset restores five.", "B5 configure_batch payload capacity 上限 批量"],
        ["Why do you reject true as a batch limit?", "为什么不能把 true 用作批量上限？", "In Python, bool is a subclass of int. Requiring the actual int type prevents true from being accepted as one. Zero, negatives, fractions and strings are rejected too.", "B5 Python bool isinstance strict integer 布尔"],
      ] },
      { label: "Signatures & nonces", items: [
        ["What is signed, and who signs it?", "交易签名覆盖哪些内容？由谁签名？", "The browser or command-line client signs the same canonical JSON with the sender's Ed25519 private key. That JSON includes the chain domain, sender, receiver, amount and nonce. The replica verifies with the sender's public key.", "B6 Ed25519 canonical payload web crypto CLI 签名 私钥 公钥"],
        ["Why do you need canonical JSON and a chain domain?", "为什么需要规范化 JSON 和链域标识？", "Sorted keys and compact JSON make the signed bytes identical across clients and replicas. The chain field binds the signature to this project's domain, so changing the domain changes what is being verified.", "canonicalization sorted domain separation 规范化 域"],
        ["How is the transaction ID calculated?", "交易 ID 是怎么计算的？", "It is Tx- followed by the first 24 hexadecimal digits of SHA-256 over the canonical payload. The ID is independent of the signature representation, so resending the same payload preserves its identity.", "stable ID hash digest identity signature case 哈希 身份"],
        ["Why check a signature again at execution?", "为什么执行交易时还要再验一次签名？", "A replica executes what is inside the committed block. Verifying there checks that the payload still matches the signature and transaction ID, even if it was never accepted by the normal admission path.", "B6 verify twice defense in depth tamper 入池 执行 二次验签", true],
        ["What if the amount changes or a different account signs?", "如果金额被修改，或者由其他账户签名，会怎样？", "Verification fails because the signed bytes or the expected public key no longer match. The request cannot enter the pool. If such an entry is encountered inside a committed block, it is rejected without consuming the sender's nonce.", "tampering wrong sender wrong key invalid signature 篡改 错签"],
        ["Can a bad entry occupy the ID of a valid pending request?", "无效条目能抢占合法待处理交易的 ID 吗？", "The execution path checks the signature and recomputes the ID before looking up a receipt. Invalid entries get position-level failure results. They do not create a canonical receipt or remove the legitimate pending request.", "forged borrowed ID poisoning canonical failure 冒用 伪造 回执", true],
        ["What is a nonce, and how does it stop replay?", "什么是 nonce？它如何防止重放？", "It is a per-sender sequence number starting at zero. A new execution must use the sender's current nonce. An identical signed retry gets back the existing identity or outcome, while a different request cannot reuse a consumed nonce.", "B6 replay prevention stale past nonce 防重放 序号", true],
        ["Can future nonces be submitted?", "可以提前提交使用未来 nonce 的交易吗？", "Yes, if the pending requests cover all earlier nonces from the current execution nonce. If zero and one are pending, two can enter the queue. Three is rejected until two is present.", "gap contiguous pending nonce future 缺号 跳号 连续"],
        ["Why does an authenticated failure consume a nonce?", "为什么通过身份验证的失败交易也会消耗 nonce？", "A valid request with the expected nonce has already taken its place in the committed order. Consuming it records a final outcome and lets later requests proceed. A wrong nonce or invalid signature consumes nothing.", "insufficient funds failure final nonce rejected 失败 消耗"],
        ["What is the difference between Retry and Sign & submit?", "Retry 和 Sign & submit 有什么区别？", "Retry sends the exact same signed request, including its nonce, so it keeps the same ID. Sign and submit creates a new request using the next nonce available for that sender.", "retry button form new nonce 提交按钮 重试"],
        ["Are transaction signatures the same as QC votes?", "交易签名和用于形成 QC 的共识投票是一回事吗？", "Transactions use Ed25519 signatures to verify sender authorization. Consensus QCs use node identities trusted by the simulator. They represent different kinds of evidence.", "consensus certificate threshold signature sender authentication 区别"],
      ] },
      { label: "Faults & recovery", items: [
        ["What happens when the leader crashes?", "领导者崩溃后会发生什么？", "The simulated timeout moves the system to a new view and rotates the leader. Three available replicas can continue making QCs. The crashed replica stays frozen until recovery.", "A6 timeout pacemaker failover 领导者 崩溃 超时"],
        ["What if only two replicas can vote?", "如果只有两个副本能投票，会发生什么？", "They cannot reach the quorum of three. The simulator may advance views, but it cannot certify new blocks with only two votes. We keep the safety threshold fixed.", "stall availability safety liveness 两节点 停滞"],
        ["How does a crashed replica catch up?", "崩溃的副本恢复后如何追上其他副本？", "It copies committed history and application state from a live peer. That includes balances, nonces and receipts. Recovery also preserves voting history and retains a higher locally justified lock or QC.", "A6 recover catch up sync receipts 恢复 同步"],
        ["What is equivocation, and how is it handled?", "什么是同一视图中的冲突提案？系统怎么处理？", "A leader equivocates when it proposes conflicting blocks in the same view. Correct replicas can vote at most once in that view, and a QC requires three matching votes. That prevents both conflicting blocks from getting QCs under the one-fault model.", "A7 byzantine conflicting proposals double proposal 拜占庭 双提案"],
        ["What is checked when evidence is malformed?", "系统如何检查格式错误或内容无效的共识证据？", "The system checks that votes come from distinct trusted identities and match the proposal's block and view. It also checks that certificates refer to the right blocks and views. Invalid evidence cannot advance the corresponding certificate or lock state.", "A7 invalid QC duplicate vote certificate malformed 非法 重复投票"],
        ["What is the difference between safety and liveness here?", "在这个项目中，安全性和活性有什么区别？", "Safety means correct replicas do not commit conflicting histories. Liveness means they keep making progress under the required conditions. With only two eligible voters, we see a stall while the quorum rule still protects safety.", "progress agreement fault tolerance 安全性 活性"],
      ] },
      { label: "Live demo", items: [
        ["How would you demonstrate Task A on screen?", "如何在界面上演示任务 A？", "I would reset, then use Next Step to show the leader's proposal, the individual votes and the QC. I would keep stepping until the first block becomes committed and point to the committed chain.", "dashboard preview step 操作 现场 共识"],
        ["What changes when Alice sends Bob 10?", "Alice 给 Bob 转账 10 后，状态会怎么变？", "Both start at 100. While it is pending, they still have 100 each and Alice's nonce is zero. Once the block commits, Alice has 90, Bob has 110, Charlie stays at 100, and Alice's nonce becomes one.", "example worked balance 90 110 success 成功 示例", true],

        ["Why do the slides and report have different test counts?", "为什么幻灯片和报告里的测试数量不同？", "The slides show an earlier Task B snapshot with 29 core and 23 extension tests. The archived Task B logs show 29 and 24 after an additional extension test. The report records 100 and 41 for the merged project, so I cite the run that matches the version I am discussing.", "29 23 24 discrepancy PPT old slides 测试数字 不一致"],

        ["Which part did you personally work on?", "你个人负责了项目的哪一部分？", "Use your own work here. A short answer is: “I worked on [function or feature]. I tested [specific scenario], which showed [actual result]. My evidence is [commit or file].”", "contribution individual responsibility AI role commits 个人贡献 分工"],

    const questions = groups.flatMap(({label, items}) => items.map(
      ([question, questionZh, answer, keywords, priority = false]) => ({label, question, questionZh, answer, keywords, priority})
    ));
    const filters = [
      {label: "Start here", matches: item => item.priority},
      {label: "All questions", matches: () => true},
      ...groups.map(({label}) => ({label, matches: item => item.label === label})),
    ];
    const allQuestions = filters[1];
    let activeFilter = filters[0];
    const topics = document.querySelector("#topics");
    const topicSelect = document.querySelector("#topic-select");
    const cards = document.querySelector("#cards");
    const input = document.querySelector("#search");
    const clear = document.querySelector("#clear");
    const status = document.querySelector("#results");
    const empty = document.querySelector("#empty");

    function words(text) {
      return text.toLowerCase().replace(/['’]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
    }

    for (const item of questions) {
      const details = document.createElement("details");
      details.className = "card";
      const summary = document.createElement("summary");
      const heading = document.createElement("span");
      const group = document.createElement("span");
      group.className = "card-group";
      group.textContent = item.label;
      const translation = document.createElement("span");
      translation.className = "question-zh";
      translation.lang = "zh-CN";
      translation.textContent = item.questionZh;
      heading.append(group, document.createTextNode(item.question), translation);
      summary.append(heading);
      const answer = document.createElement("p");
      answer.className = "answer";
      answer.lang = "en";
      answer.textContent = item.answer;
      details.append(summary, answer);
      cards.append(details);
      item.card = details;
      item.group = group;
      item.searchText = words([item.question, item.questionZh, item.answer, item.label, item.keywords].join(" "));
    }

    function choose(filter) {
      activeFilter = filter;
      if (filter === filters[0]) input.value = "";
      update();
    }

    for (const [index, filter] of filters.entries()) {
      const button = document.createElement("button");
      button.className = "topic";
      button.type = "button";
      const count = document.createElement("span");
      count.className = "topic-count";
      count.textContent = questions.filter(filter.matches).length;
      button.append(document.createTextNode(filter.label), count);
      button.addEventListener("click", () => choose(filter));
      filter.button = button;
      topics.append(button);
      topicSelect.add(new Option(`${filter.label} (${count.textContent})`, String(index)));
    }

    function update() {
      const tokens = words(input.value).split(" ").filter(Boolean);
      if (tokens.length && activeFilter === filters[0]) activeFilter = allQuestions;
      let matches = 0;
      for (const item of questions) {
        const visible = activeFilter.matches(item) && tokens.every(token => item.searchText.includes(token));
        item.card.hidden = !visible;
        item.group.hidden = activeFilter !== filters[0] && activeFilter !== allQuestions;
        if (visible) matches += 1;
      }
      for (const filter of filters) {
        filter.button.setAttribute("aria-pressed", String(filter === activeFilter));
      }
      topicSelect.value = String(filters.indexOf(activeFilter));
      status.textContent = `${activeFilter.label} · ${matches} ${matches === 1 ? "question" : "questions"}`;
      clear.hidden = !input.value;
      empty.hidden = matches > 0;
    }

    document.querySelector("#search-form").addEventListener("submit", event => {
      event.preventDefault();
      update();
    });
    topicSelect.addEventListener("change", () => choose(filters[Number(topicSelect.value)]));
    input.addEventListener("input", update);
    clear.addEventListener("click", () => {
      input.value = "";
      input.focus();
      update();
    });
    questions[0].card.open = true;
    update();
  </script>
</body>
